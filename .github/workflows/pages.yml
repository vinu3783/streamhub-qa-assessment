name: Publish app and reports

# Publishes the live app at https://<user>.github.io/<repo>/ and the committed test evidence
# under /reports/, so reviewers can open the HTML reports without downloading them.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build for the repository sub-path
        run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      - name: Add SPA fallback and the committed reports
        run: |
          # GitHub Pages has no SPA rewrite; serving index.html as 404.html keeps deep links working.
          cp dist/index.html dist/404.html
          cp -r reports dist/reports
          # Serve report files as-is (no Jekyll processing).
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
